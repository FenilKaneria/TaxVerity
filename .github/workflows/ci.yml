# Step 15.4 (ESSENTIAL, rule 01 product-first mode), extended by Step 18.2.
# Independent jobs: lint, the frontend's lint/tests, a dependency audit of both lockfiles,
# and a Docker build check. The Python test suite, evals and reports are kept
# out of the public repo and run locally. No secret is configured here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # Step 18.2: known-vulnerability scan of exactly what ships — the locked
  # Python dependencies (no dev group, as in the image) and the frontend's
  # production npm tree. Fails on high/critical npm advisories and on any
  # pip-audit finding.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv export --locked --no-dev --no-emit-project --format requirements-txt > requirements.txt
      - run: uvx pip-audit --strict --disable-pip -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
