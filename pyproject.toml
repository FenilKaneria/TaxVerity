[project]
name = "taxverity"
description = "Evidence-grounded question answering over the Income-tax Act, 2025 (India)."
readme = "README.md"
authors = [
    { name = "FenilKaneria", email = "fenilk.test@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx2>=2.12.0",
    "numpy>=2.2",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "pymupdf>=1.28.2",
    "uvicorn>=0.34",
]
dynamic = ["version"]

[project.optional-dependencies]
# Model runtime for the local reference embedder only — the offline fidelity
# check against the Jina hosted API that actually serves embeddings (ADR-075).
# Deliberately not a base dependency, and no deploy image installs it: the
# Lambda image (ADR-076) must not carry torch.
embed = [
    "torch>=2.8",
    "transformers>=5.1",
    "sentence-transformers>=5.0",
    "peft>=0.15.2",
    "einops>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/taxverity/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/taxverity"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pytest>=8.3",
    "ruff>=0.9",
]

# PyTorch does not publish CUDA wheels for Windows on PyPI (only the CPU wheel),
# so torch is drawn from its own indexes by platform: the dev machine (Windows,
# RTX 3050, CUDA 13.x) gets the cu130 wheel for the Step 4.4 batch job; every
# other platform, production included, gets the CPU wheel. This encodes the
# prod/dev split in the lockfile rather than in an image-build step. See ADR-070.
# `explicit = true` keeps all other packages on PyPI.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'win32'" },
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
