[project]
name = "taxverity"
description = "Evidence-grounded question answering over the Income-tax Act, 2025 (India)."
readme = "README.md"
authors = [
    { name = "FenilKaneria", email = "fenilk.test@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.7",
    "pymupdf>=1.28.2",
]
dynamic = ["version"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/taxverity/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/taxverity"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
